name: Build Customer App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Shell & Setup Flat Structure
        run: |
          # 1. Pubspec backup
          cp pubspec.yaml pubspec.yaml.bak 2>/dev/null || true
          cp pubspec.lock pubspec.lock.bak 2>/dev/null || true

          # 2. Native shell generate
          flutter create --org com.liebe --project-name liebe_customer --overwrite .

          # 3. Pubspec restore
          cp pubspec.yaml.bak pubspec.yaml 2>/dev/null || true
          cp pubspec.lock.bak pubspec.lock 2>/dev/null || true

          # 4. Enable Core Library Desugaring for Kotlin (.kts) and Groovy (.gradle)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4" }' >> android/app/build.gradle
          fi

          # 4b. Inject Internet & Network Permissions into AndroidManifest.xml safely
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

          # 4c. Set App Display Name to Nishant Laundry
          sed -i 's/android:label=".*"/android:label="Nishant Laundry"/' android/app/src/main/AndroidManifest.xml

          # 5. Target directories
          mkdir -p lib/screens lib/models lib/services lib/widgets lib/utils

          # 6. Copy ALL root .dart files into lib/ directly
          find . -maxdepth 1 -name "*.dart" ! -name "widget_test.dart" -exec cp {} lib/ \;

          # 7. Copy ALL root .dart files AND screens folder into lib/screens/ as well
          find . -maxdepth 1 -name "*.dart" ! -name "widget_test.dart" -exec cp {} lib/screens/ \;
          [ -d "screens" ] && cp -r screens/* lib/screens/ 2>/dev/null || true
          [ -d "models" ] && cp -r models/* lib/models/ 2>/dev/null || true
          [ -d "services" ] && cp -r services/* lib/services/ 2>/dev/null || true
          [ -d "widgets" ] && cp -r widgets/* lib/widgets/ 2>/dev/null || true
          [ -d "utils" ] && cp -r utils/* lib/utils/ 2>/dev/null || true

      - name: Get dependencies
        run: |
          flutter pub get --no-example

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=SUPABASE_URL=https://vtgmbshjtfcqlpivylam.supabase.com --dart-define=SUPABASE_ANON_KEY=sb_publishable_O6--UWv7Mo7w_NzX1WqLuA_ASzdUJIW --dart-define=API_URL=http://10.0.2.2:4000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
