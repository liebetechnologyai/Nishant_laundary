name: Build Customer App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Shell & Setup Flat Structure
        run: |
          # 1. Root me jo pubspec.yaml aur pubspec.lock hain unka backup le lo
          cp pubspec.yaml pubspec.yaml.bak 2>/dev/null || true
          cp pubspec.lock pubspec.lock.bak 2>/dev/null || true

          # 2. Native shell generate karo
          flutter create --org com.liebe --project-name liebe_customer --overwrite .

          # 3. Apni original pubspec files ko restore karo
          cp pubspec.yaml.bak pubspec.yaml 2>/dev/null || true
          cp pubspec.lock.bak pubspec.lock 2>/dev/null || true

          # 4. Root ki saari .dart files aur folders ko lib/ ke andar shift karo
          mkdir -p lib
          find . -maxdepth 1 -name "*.dart" ! -name "widget_test.dart" -exec cp {} lib/ \;
          [ -d "screens" ] && cp -r screens lib/ || true
          [ -d "models" ] && cp -r models lib/ || true
          [ -d "services" ] && cp -r services lib/ || true
          [ -d "widgets" ] && cp -r widgets lib/ || true
          [ -d "utils" ] && cp -r utils lib/ || true


      - name: Get dependencies
        run: |
          flutter pub get --no-example

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=SUPABASE_URL=https://vtgmbshjtfcqlpivylam.supabase.com --dart-define=SUPABASE_ANON_KEY=sb_publishable_O6--UWv7Mo7w_NzX1WqLuA_ASzdUJIW --dart-define=API_URL=http://10.0.2.2:4000

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
